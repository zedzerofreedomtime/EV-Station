services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: rbc_ev_station
      POSTGRES_USER: rbc
      POSTGRES_PASSWORD: rbc
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbc -d rbc_ev_station"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://rbc:rbc@db:5432/rbc_ev_station?sslmode=disable", "up"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: development
      API_PORT: 8080
      DATABASE_URL: postgres://rbc:rbc@db:5432/rbc_ev_station?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      ANALYSIS_PROVIDER_MODE: osm
      OVERPASS_API_URL: https://overpass-api.de/api/interpreter
      NOMINATIM_API_URL: https://nominatim.openstreetmap.org/search
      NOMINATIM_COUNTRY_CODES: th
      GEOCODING_CACHE_TTL: 720h
      EXTERNAL_USER_AGENT: RBC-EV-Station-MVP/0.1
      EXTERNAL_HTTP_TIMEOUT: 20s
      WORLDPOP_API_URL: https://api.worldpop.org/v2
      WORLDPOP_YEAR: 2025
      WORLDPOP_RESOLUTION: 100m
      WORLDPOP_CACHE_TTL: 720h
      GISTDA_API_KEY: ${GISTDA_API_KEY:-}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
